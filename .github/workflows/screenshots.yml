name: Documentation screenshots

on:
  push:
    branches: [docs-screenshots, cepwater, ui-polish, measures-db, flow-diagram, flow-edit, econ, indicators, ts-water, flow-time, industrial-merge, single-entry, series-core]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest

      - name: Download Vazirmatn font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets/fonts | Out-Null
          Invoke-WebRequest "https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip" -OutFile v.zip
          Expand-Archive v.zip -DestinationPath vz -Force
          Copy-Item (Get-ChildItem -Recurse vz -Filter "Vazirmatn-Regular.ttf" | Select-Object -First 1).FullName assets/fonts/
          Copy-Item (Get-ChildItem -Recurse vz -Filter "Vazirmatn-Bold.ttf" | Select-Object -First 1).FullName assets/fonts/

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Render screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_screenshots.py docs/img

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/img/*.png
          retention-days: 1
        continue-on-error: true      # the PNGs are committed below; a full artifact quota must not stop that

      - name: Commit screenshots to this branch
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/img
          git diff --cached --quiet || git commit -m "Update documentation screenshots"
          git push origin HEAD:${GITHUB_REF_NAME}
